<div class="flex-grow-1" aria-hidden="true"></div>
<footer id="footerwrap" class="site-footer">
  <div class="container site-footer__inner">
    <div class="site-footer__identity">
      <span class="site-footer__title">{{ site.title | escape }}</span>
      <span class="site-footer__description">开源软件镜像服务</span>
    </div>
    <div class="site-footer__meta">
      {% if site.operator and site.operator != "" %}
      <span>{{ site.operator | escape }}</span>
      {% endif %}
      <span>© {{ site.time | date: "%Y" }}</span>
    </div>
  </div>
  <div class="container site-footer__sources">
    <span>本站代码托管于 GitHub</span>
    <ul class="site-footer__projects" aria-label="项目源码">
      <li>
        <span>Web</span>
        <a href="https://github.com/tuna/mirror-web" target="_blank" rel="noopener noreferrer" aria-label="Web 原仓库">原仓库</a>
        <span aria-hidden="true">·</span>
        <a href="https://github.com/cyxc1124/mirror-web" target="_blank" rel="noopener noreferrer" aria-label="Web 本站 Fork">本站 Fork</a>
      </li>
      <li>
        <span>Tunasync</span>
        <a href="https://github.com/tuna/tunasync" target="_blank" rel="noopener noreferrer" aria-label="Tunasync 原仓库">原仓库</a>
        <span aria-hidden="true">·</span>
        <a href="https://github.com/cyxc1124/tunasync" target="_blank" rel="noopener noreferrer" aria-label="Tunasync 本站 Fork">本站 Fork</a>
      </li>
    </ul>
  </div>
</footer>
{% fa_svg_generate %}
